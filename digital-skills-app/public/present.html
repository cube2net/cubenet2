<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>العرض التقديمي · المهارات الرقمية</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/present.css">
</head>
<body>
  <div class="deck" id="deck">
    <div class="stage-wrap" id="stage-wrap">
      <div class="stage" id="stage" aria-live="polite"></div>
    </div>
    <aside class="notes" id="notes" hidden></aside>
    <nav class="controls" aria-label="التحكم في العرض">
      <a class="ctl" id="exit" href="/" title="العودة إلى الدرس">&times;<span class="lbl">خروج</span></a>
      <button class="ctl" id="prev" type="button" title="السابق (→)">&rarr;<span class="lbl">السابق</span></button>
      <span class="count" id="count">0 / 0</span>
      <button class="ctl primary" id="next" type="button" title="التالي (← أو المسافة)"><span class="lbl">التالي</span>&larr;</button>
      <div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>
      <button class="ctl" id="toggle-notes" type="button" aria-pressed="false" title="ملاحظات المعلم (N)">📝<span class="lbl">ملاحظات المعلم</span></button>
      <button class="ctl" id="fullscreen" type="button" title="ملء الشاشة (F)">⛶<span class="lbl">ملء الشاشة</span></button>
    </nav>
  </div>

  <script src="/visuals.js"></script>
  <script src="/common.js"></script>
  <script src="/present.js"></script>
</body>
</html>
