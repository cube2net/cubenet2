services:
  app:
    build: .
    image: digital-skills-app:latest
    restart: unless-stopped
    ports:
      # Reachable from the home LAN only (for teachers testing locally)
      - "3000:3000"
    volumes:
      # Lesson content can be edited on the host without rebuilding the image
      - ./content:/app/content:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app
