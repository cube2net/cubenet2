name: Build theme (public/)

on:
  push:
    branches: [main, master]
    paths: ['src/**', 'webpack.config.js', 'tailwind.config.js', 'postcss.config.js', 'package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run production
      - name: Commit built public/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public
          git diff --cached --quiet || (git commit -m "build: update public/ [skip ci]" && git push)
