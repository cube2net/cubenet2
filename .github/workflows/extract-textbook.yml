# Temporary: the Claude session cannot reach iencontent.ien.edu.sa, so this job
# downloads the grade 6 digital skills textbook, extracts text and images,
# and pushes them to the book-extract-1448 branch. Remove after use.
name: Extract textbook (temporary)

on:
  push:
    branches: [claude/digital-skills-app-ms4pld]
    paths: ['.github/workflows/extract-textbook.yml', '.github/scripts/extract_book.py']

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install pymupdf pillow
      - name: Download and extract
        env:
          UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36
        run: |
          mkdir -p work out
          for t in 1 2; do
            url="https://iencontent.ien.edu.sa/Books/1448-GE-PE-K06-SM${t}-mcomp.pdf"
            {
              echo "== $url"
              getent hosts iencontent.ien.edu.sa || echo "dns failed"
              curl -sS -o /dev/null -m 60 -w "plain: %{http_code} %{size_download}\n" "$url" 2>&1 || true
              curl -sS -I -m 60 -A "$UA" -H "Referer: https://ien.edu.sa/" "$url" 2>&1 | head -20 || true
            } >> out/diagnostics.txt
            if curl -fL --retry 3 -m 900 -A "$UA" -H "Referer: https://ien.edu.sa/" -o work/t$t.pdf "$url" 2>>out/diagnostics.txt; then
              ls -la work/t$t.pdf
              python .github/scripts/extract_book.py work/t$t.pdf out/t$t
            else
              echo "not available: $url" | tee out/t$t-missing.txt
            fi
          done
          du -sh out/* || true
      - name: Push results to temporary branch
        run: |
          cd out
          git init -q -b book-extract-1448
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -qm "Extracted textbook pages (temporary)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" book-extract-1448
